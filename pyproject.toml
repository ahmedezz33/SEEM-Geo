[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seem-geo"
version = "1.2.2"
description = "SEEM Geo — Professional ERT & MASW Processing Suite for engineering-geology site investigations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "SEEM Geo contributors" }
]
maintainers = [
  { name = "SEEM Geo contributors" }
]
keywords = [
  "geophysics", "ert", "masw", "wenner", "resistivity",
  "shear-wave", "vs30", "site-classification",
  "engineering-geology", "foundation-design", "hvdc"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "pymdown-extensions>=10"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
build = ["pyinstaller>=5.0", "build>=1.0", "twine>=4.0"]
all = ["seem-geo[docs,test,build]"]

[project.urls]
Homepage = "https://github.com/ahmedezz33/seem-geo"
Documentation = "https://ahmedezz33.github.io/seem-geo"
Repository = "https://github.com/ahmedezz33/seem-geo"
Issues = "https://github.com/ahmedezz33/seem-geo/issues"
Changelog = "https://github.com/ahmedezz33/seem-geo/blob/main/CHANGELOG.md"

[project.scripts]
seem-geo = "seem_geo.__main__:main"
seem-geo-gui = "seem_geo.gui.main_window:main"

[tool.setuptools]
packages = { find = { include = ["seem_geo*"] } }
include-package-data = true

[tool.setuptools.package-data]
"seem_geo" = ["data/*.json", "data/*.csv"]
